# CI: typecheck + unit tests and an extension build on every push to main and every PR;
# the Playwright e2e smoke on PRs. Actions are SHA-pinned; bump SHAs deliberately, never `@vN`.
#   actions/checkout@v6          -> d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-node@v6        -> 249970729cb0ef3589644e2896645e5dc5ba9c38
#   pnpm/action-setup@v4         -> b906affcce14559ad1aafd4ab0e942779e9f58b1
#   actions/upload-artifact@v6   -> b7c566a772e6b6bfb58ed0dc250532a479d7789f

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Two extension unit suites measure layout and contrast in real Chromium.
      - run: pnpm -F extension exec playwright install --with-deps chromium
      - run: pnpm verify

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F extension zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tripwire-extension
          path: apps/extension/.output/*-chrome.zip
          retention-days: 14

  e2e:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F extension exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm verify:e2e
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: apps/extension/test-results/
          retention-days: 7
