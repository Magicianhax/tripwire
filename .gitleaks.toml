# gitleaks config: extends the default ruleset with web3 key shapes.
# Run: gitleaks git --pre-commit --staged --redact --no-banner
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "project gitleaks"

[extend]
useDefault = true

[[rules]]
id = "evm-private-key"
description = "EVM private key (64 hex, optional 0x) assigned to a key-like name"
regex = '''(?i)(private[_-]?key|priv[_-]?key|signer[_-]?key|deployer[_-]?key|pk)\s*[:=]\s*["']?(0x)?[0-9a-f]{64}["']?'''
keywords = ["private_key", "privatekey", "priv_key", "signer_key", "deployer_key", "pk="]
entropy = 3.0

[[rules]]
id = "evm-private-key-bare"
description = "Bare 0x-prefixed 64-hex value (likely a private key)"
regex = '''\b0x[0-9a-fA-F]{64}\b'''
entropy = 3.5
[rules.allowlist]
# tx hashes, storage slots and bytes32 constants are also 64 hex; allow known-safe file types.
# Test suites and recorded page captures carry public bytes32 pool ids (Robinhood/Dexscreener
# pools are bytes32, not 20-byte addresses) — a pool id is public and authenticates nothing.
paths = [
  '''\.(json|lock|log|md|ya?ml)$''', '''broadcast/''', '''cache/''', '''out/''',
  '''(^|/)test/''', '''(^|/)e2e/''', '''\.(test|spec)\.[jt]sx?$''', '''(^|/)\.playwright-mcp/''',
]

[[rules]]
id = "solana-keypair-json"
description = "Solana keypair as a 64-element byte array"
regex = '''\[\s*(\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''
keywords = ["[", ","]
[rules.allowlist]
paths = ['''package-lock\.json$''', '''pnpm-lock\.yaml$''']

[[rules]]
id = "solana-base58-secret"
description = "Base58 Solana secret key (87-88 chars) assigned to a key-like name"
regex = '''(?i)(secret[_-]?key|private[_-]?key|keypair|wallet[_-]?key)\s*[:=]\s*["']?[1-9A-HJ-NP-Za-km-z]{87,88}["']?'''
keywords = ["secret_key", "private_key", "keypair", "wallet_key"]

[[rules]]
id = "mnemonic-phrase"
description = "12 or 24 word BIP-39 style mnemonic assigned to a name"
regex = '''(?i)(mnemonic|seed[_-]?phrase|recovery[_-]?phrase)\s*[:=]\s*["']?([a-z]+\s+){11,23}[a-z]+["']?'''
keywords = ["mnemonic", "seed_phrase", "recovery_phrase"]

[[rules]]
id = "rpc-url-with-key"
description = "RPC URL embedding a provider key"
regex = '''https?://[a-z0-9.-]+\.(alchemy|infura|quicknode|helius|ankr)[a-z./-]*/(v2|v3|rpc)?/?[A-Za-z0-9_-]{24,}'''
keywords = ["alchemy", "infura", "quicknode", "helius", "ankr"]

[[allowlists]]
description = "Global allowlist"
paths = ['''(^|/)\.gitleaks\.toml$''', '''(^|/)node_modules/''', '''(^|/)\.git/''']
regexes = ['''0x0{64}''', '''0xf{64}''']

# Recorded Nansen fixtures list the public ERC-20 contract a wallet holds under a field
# literally named `token_address`, which trips the default generic-api-key rule on the word
# "token". A contract address is public by definition and authenticates nothing. Scoped to the
# replay fixtures and to that exact field so it cannot hide a key anywhere else.
[[allowlists]]
description = "Public token contract addresses in recorded fixtures"
condition = "AND"
paths = ['''fixtures/.*\.json$''']
regexTarget = "line"
regexes = ['''"token_address"\s*:\s*"0x[0-9a-fA-F]{40}"''']

# Polymarket's Gamma market object nests an `events[]` entry carrying `pythTokenID`: the public
# Pyth price-feed id the event resolves against (BTC/USD here). It is a 64-hex identifier
# published in Pyth's own feed directory, it authenticates nothing, and the word "Token" is what
# trips the default generic-api-key rule. Scoped to the replay fixtures and to that exact field.
[[allowlists]]
description = "Public Pyth price-feed ids in recorded Polymarket fixtures"
condition = "AND"
paths = ['''fixtures/.*\.json$''']
regexTarget = "line"
regexes = ['''"pythTokenID"\s*:\s*"[0-9a-fA-Fx]{1,70}"''']

# Public onchain identifiers that name themselves. Nansen fixtures, the venue test suites, the
# recorded venue DOM captures and the venue-check notes all carry ERC-20 contract addresses,
# pool ids and token names under fields literally called `token_address`, `tokenAddress`,
# `toToken`, `pairAddress` or `token_name`. The word "token" is what trips the default
# generic-api-key rule; every one of these values is published onchain and authenticates
# nothing. Scoped to those file kinds and to lines that name one of those fields, so the rule
# still fires on an unannotated high-entropy string anywhere else.
[[allowlists]]
description = "Public token/pool identifiers in fixtures, tests, captures and venue notes"
condition = "AND"
paths = [
  '''fixtures/.*\.json$''', '''(^|/)test/''', '''(^|/)e2e/''',
  '''\.(test|spec)\.[jt]sx?$''', '''(^|/)\.playwright-mcp/''', '''(^|/)docs/VENUE-CHECK\.md$''',
  '''(^|/)public/showcase/README\.md$''',
]
regexTarget = "line"
regexes = ['''(?i)"?(token_address|tokenAddress|token_name|toToken|outputCurrency|pairAddress|poolId)"?\s*[:=]''']
