              - generic [ref=f38e243]: This market will resolve to “Yes” if Friedrich Merz ceases to be the Chancellor of Germany for any period of time by the specified date, 11:59 PM ET. Otherwise, this market will resolve to “No”. An announcement of Friedrich Merz's resignation/removal before this market's end date will immediately resolve this market to "Yes", regardless of when the announced resignation/removal goes into effect. The resolution source for this market will be the government of Germany, however a consensus of credible reporting will also suffice.
              - generic [ref=f38e244]: Friedrich Merz faces mounting pressure after just 16 months as chancellor, driven by the CDU’s crushing defeat in the September 6 Saxony-Anhalt state election, where the AfD captured 43.8% and the CDU fell to 17.2%. National polling now places the AfD ahead at 28–29% while the CDU/CSU sits near 18–20%, with Merz’s personal approval at record lows. Speculation centers on a possible Kanzlertausch or coalition strains within the CDU-SPD government, though eight CDU state premiers publicly backed him on September 16 to prioritize stability ahead of further state votes in Mecklenburg-Western Pomerania and Berlin on September 20. Merz has reaffirmed his intent to complete the full term and advance economic reforms, while party leadership meets Sunday evening to assess results. These near-term electoral tests and internal cohesion will shape any near-term shift in his tenure.
