                      - button "What is the \"Fed Decision in October?\" prediction market?" [ref=f53e581] [cursor=pointer]
                    - region "What is the \"Fed Decision in October?\" prediction market?":
                      - generic [ref=f53e584]: "\"Fed Decision in October?\" is a prediction market on Polymarket with 5 possible outcomes where traders buy and sell shares based on what they believe will happen. The current leading outcome is \"No change\" at 53%, followed by \"25 bps increase\" at 47%. Prices reflect real-time crowd-sourced probabilities. For example, a share priced at 53¢ implies that the market collectively assigns a 53% chance to that outcome. These odds shift continuously as traders react to new developments and information. Shares in the correct outcome are redeemable for $1 each upon market resolution."
                  - generic [ref=f53e585]:
                    - heading [level=3] [ref=f53e586]:
                      - button "How much trading activity has \"Fed Decision in October?\" generated on Polymarket?" [ref=f53e587] [cursor=pointer]
                    - region "How much trading activity has \"Fed Decision in October?\" generated on Polymarket?":
                      - generic [ref=f53e590]: As of today, "Fed Decision in October?" has generated $5.9 million in total trading volume since the market launched on Jun 17, 2026. This level of trading activity reflects strong engagement from the Polymarket community and helps ensure that the current odds are informed by a deep pool of market participants. You can track live price movements and trade on any outcome directly on this page.
                  - generic [ref=f53e591]:
                    - heading [level=3] [ref=f53e592]:
                      - button "How do I trade on \"Fed Decision in October?\"?" [ref=f53e593] [cursor=pointer]
                    - region "How do I trade on \"Fed Decision in October?\"?":
                      - generic [ref=f53e596]: To trade on "Fed Decision in October?," browse the 5 available outcomes listed on this page. Each outcome displays a current price representing the market's implied probability. To take a position, select the outcome you believe is most likely, choose "Yes" to trade in favor of it or "No" to trade against it, enter your amount, and click "Trade." If your chosen outcome is correct when the market resolves, your "Yes" shares pay out $1 each. If it's incorrect, they pay out $0. You can also sell your shares at any time before resolution if you want to lock in a profit or cut a loss.
                  - generic [ref=f53e597]:
                    - heading [level=3] [ref=f53e598]:
                      - button "What are the current odds for \"Fed Decision in October?\"?" [ref=f53e599] [cursor=pointer]
                    - region "What are the current odds for \"Fed Decision in October?\"?":
                      - generic [ref=f53e602]: The current frontrunner for "Fed Decision in October?" is "No change" at 53%, meaning the market assigns a 53% chance to that outcome. The next closest outcome is "25 bps increase" at 47%. These odds update in real-time as traders buy and sell shares, so they reflect the latest collective view of what's most likely to happen. Check back frequently or bookmark this page to follow how the odds shift as new information emerges.
                  - generic [ref=f53e603]:
                    - heading [level=3] [ref=f53e604]:
                      - button "How will \"Fed Decision in October?\" be resolved?" [ref=f53e605] [cursor=pointer]
                    - region "How will \"Fed Decision in October?\" be resolved?":
                      - generic [ref=f53e608]: The resolution rules for "Fed Decision in October?" define exactly what needs to happen for each outcome to be declared a winner — including the official data sources used to determine the result. You can review the complete resolution criteria in the "Rules" section on this page above the comments. We recommend reading the rules carefully before trading, as they specify the precise conditions, edge cases, and sources that govern how this market is settled.
