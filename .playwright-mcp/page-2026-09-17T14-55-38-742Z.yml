            - generic [ref=f53e348]:
              - generic [ref=f53e349]: "The FED interest rates are defined in this market by the upper bound of the target federal funds range. The decisions on the target federal funds range are made by the Federal Open Market Committee (FOMC) meetings. This market will resolve to the amount of basis points the upper bound of the target federal funds rate is changed by versus the level it was prior to the Federal Reserve's October 2026 meeting. If the target federal funds rate is changed to a level not expressed in the displayed options, the change will be rounded up to the nearest 25 and will resolve to the relevant bracket. (e.g. if there's a cut/increase of 12.5 bps it will be considered to be 25 bps) The resolution source for this market is the FOMC’s statement after its meeting scheduled for October 27-28, 2026 according to the official calendar: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm. The level and change of the target federal funds rate is also published at the official website of the Federal Reserve at https://www.federalreserve.gov/monetarypolicy/openmarket.htm. This market may resolve as soon as the FOMC’s statement for their October meeting with relevant data is issued. If no statement is released by the end date of the next scheduled meeting, this market will resolve to the \"No change\" bracket."
              - generic [ref=f53e350]: "**The September 16 FOMC decision to raise the federal funds rate 25 basis points to the 3.75-4.00% range, paired with a dot plot showing 16 of 18 officials expecting at least one additional hike by year-end, is the dominant factor shaping trader views on the October meeting.** Persistent inflation—August CPI at 3.4% year-over-year with core at 2.4%—and upward revisions to the inflation and neutral rate forecasts have reinforced expectations for further tightening, while geopolitical energy price pressures add upside risks. Markets price the October outcome near even odds because the next data release (September CPI on October 14) and election timing create scope for either a pause or another 25-basis-point move, with futures and prediction platforms showing closely contested probabilities around 50%. Upcoming labor market and inflation prints will likely determine whether the consensus shifts toward consecutive hikes or a hold."
