                        - generic [ref=f50e560]: To trade on "Clarity Act (H.R.3633) signed into law in 2026?," simply choose whether you believe the answer is "Yes" or "No." Each side has a current price that reflects the market's implied probability. Enter your amount and click "Trade." If you buy "Yes" shares and the outcome resolves as "Yes," each share pays out $1. If it resolves as "No," your "Yes" shares pay $0. You can also sell your shares at any time before resolution if you want to lock in a profit or cut a loss.
