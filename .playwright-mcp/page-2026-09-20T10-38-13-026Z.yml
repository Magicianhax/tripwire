              - generic [ref=f57e3201]:
                - region [ref=f57e3202]:
                  - heading "About Perps" [level=2] [ref=f57e3203]
                  - generic [ref=f57e3204]:
                    - paragraph [ref=f57e3205]: Perps, short for perpetual futures, let you go long or short on an asset with leverage and no expiration date. Unlike traditional futures, perps never settle on a calendar date. A funding rate periodically transfers payments between longs and shorts to keep each contract anchored to its underlying reference price, and positions stay open as long as your margin holds.
                    - paragraph [ref=f57e3206]: On Polymarket you can trade perps across individual stocks like Tesla and Nvidia, crypto assets like Bitcoin and Ethereum, major indices including the USA500 and Nasdaq 100, and commodities such as Gold, Silver, and WTI Oil. Each card shows the live mark price and 24-hour change - click Long to bet the price rises or Short to bet it falls, directly from the grid above.
