                      - heading [level=3] [ref=f64e749]:
                        - button "What is BTC on Polymarket?" [ref=f64e750] [cursor=pointer]
                      - region "What is BTC on Polymarket?":
                        - generic [ref=f64e754]: BTC is a perpetual futures contract on Polymarket that tracks the price of Bitcoin (BTC). It lets you go long or short on BTC using pUSD as collateral, with no expiry date, so you can hold your position as long as you want. Right now, BTC is trading at $80,335, down 1.05% in the last 24 hours.
                    - generic [ref=f64e755]:
                      - heading [level=3] [ref=f64e756]:
                        - button "What leverage is available for BTC perpetuals?" [ref=f64e757] [cursor=pointer]
                      - region "What leverage is available for BTC perpetuals?":
                        - generic [ref=f64e761]: You can trade BTC with up to 50x leverage on Polymarket. The default margin mode is Isolated. For example, with 50x leverage and a $1,000 position, you're controlling $50,000.00 worth of BTC. Higher leverage amplifies both gains and losses, and at current settings, a 50x long position would have a liquidation price around $79,500.
                    - generic [ref=f64e762]:
                      - heading [level=3] [ref=f64e763]:
                        - button "How is the BTC price determined?" [ref=f64e764] [cursor=pointer]
                      - region "How is the BTC price determined?":
                        - generic [ref=f64e768]:
                          - text: BTC uses two prices. The
                          - strong [ref=f64e769]: oracle price
                          - text: (80,335) reflects Bitcoin's real-time spot price from external data feeds. The
                          - strong [ref=f64e770]: mark price
                          - text: (80,311) is Polymarket's calculated fair value used for P&L and liquidations. Right now, the spread between mark and oracle is just $24 (0.03%), which means the contract is tracking BTC's spot price very closely. A funding rate of 0.0013% is applied every funding cycle to keep these prices aligned.
                    - generic [ref=f64e771]:
                      - heading [level=3] [ref=f64e772]:
                        - button "Can I short Bitcoin on Polymarket?" [ref=f64e773] [cursor=pointer]
                      - region "Can I short Bitcoin on Polymarket?":
                        - generic [ref=f64e777]: Yes. On the BTC trading page, select Short at the top of the order panel, set your amount and leverage (up to 50x), and hit Trade. You'll profit when BTC's price drops.
                    - generic [ref=f64e778]:
                      - heading [level=3] [ref=f64e779]:
                        - button "What is the trading volume and liquidity for BTC?" [ref=f64e780] [cursor=pointer]
