                  - generic:
                    - paragraph: A DeFi exchange is a decentralized platform that enables users to trade cryptocurrencies directly with each other using smart contracts, without intermediaries like banks or centralized exchanges. It gives traders full control over their funds and enables peer-to-peer transactions on the blockchain.
                - generic [ref=f111e390]:
                  - heading [level=3] [ref=f111e391]:
                    - button "Is 1inch a DeFi exchange?" [ref=f111e392] [cursor=pointer]
                  - generic:
                    - paragraph: 1inch Swap began as a DEX aggregator, combining liquidity across multiple exchanges to find users the best swap rates. Now, it’s a lot more - with intent-based swaps and cross-chain functionality built on atomic execution to keep assets safe. But it’s still built on the principle of uniting liquidity from across the ecosystem to make crypto swaps more efficient and return better token prices.
                - generic [ref=f111e399]:
