<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jupiter (e2e stub)</title>
    <style>
      /* Dark, Jupiter-like chrome so the block screen is exercised on the ground it sits on.
         Layout (the 420px gap above the form) is what the click-through test relies on. */
      body { font-family: system-ui, sans-serif; margin: 0; background: #131a24; color: #e8f9ff; }
      header { display: flex; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid #24303f; }
      header button { min-height: 36px; padding: 0 14px; border: 1px solid #304256; border-radius: 12px; background: #1c2633; color: inherit; }
      main { margin: 420px auto 0; width: 360px; }
      form { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #1c2633; }
      label { display: grid; gap: 6px; color: #9aa9b8; }
      input { height: 40px; padding: 0 12px; border: 1px solid #304256; border-radius: 10px; background: #131a24; color: inherit; }
      #swap { height: 48px; border: none; border-radius: 12px; background: #c7f284; color: #0b1016; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <button id="token-picker" type="button">Select token</button>
      <span id="picker-clicks">0</span>
    </header>
    <main>
      <form onsubmit="return false">
        <label>You pay <input id="amount" placeholder="0.00" /></label>
        <button id="swap" type="button">Swap</button>
      </form>
    </main>
    <script>
      window.swapClicks = 0;
      let pickerClicks = 0;
      document.getElementById("swap").addEventListener("click", () => {
        window.swapClicks += 1;
      });
      document.getElementById("token-picker").addEventListener("click", () => {
        pickerClicks += 1;
        document.getElementById("picker-clicks").textContent = String(pickerClicks);
      });
    </script>
  </body>
</html>
