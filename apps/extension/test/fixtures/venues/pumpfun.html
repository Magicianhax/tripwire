<!-- Reconstructed from pumpfun-buy-tab.json / pumpfun-sell-tab.json (pump.fun/coin/<mint>, 2026-09-17, logged
     out). Button structure, text and attributes only. The desktop trade panel sits in "hidden lg:block"; the
     real DOM also holds an unrendered mobile copy (26 hidden buttons), left out here because happy-dom's
     visibility check does not model display:none ancestors. Tests flip the Buy/Sell tab state to model the
     captured Sell state. -->
<div class="pump-main-shell flex flex-col w-full">
  <header class="flex flex-col sticky top-0">
    <div class="flex items-center justify-between w-full">
      <div class="flex items-center justify-end h-full">
        <div class="max-[480px]:hidden"><div role="button"><button type="button" aria-pressed="false" aria-label="Create"></button></div></div>
        <span class="inline-flex"><button type="button" aria-pressed="false" data-testid="sign-in-button">Sign in</button></span>
      </div>
    </div>
    <div data-testid="token-info-bar" class="flex h-9 items-center gap-2">
      <div role="radiogroup" aria-label="Info bar content"><button role="radio" aria-checked="true" aria-label="Top traders"></button></div>
    </div>
  </header>
  <main class="relative flex flex-1 flex-col">
    <div class="@container">
      <ul aria-label="Top holders" class="flex w-full flex-col">
        <li><div role="button" data-testid="coin-holders-row" aria-label="View holder position">holder $365.97</div></li>
      </ul>
      <div class="mb-2 flex flex-wrap items-center">
        <div role="tablist" class="inline-flex items-center h-auto w-auto">
          <button type="button" role="tab" aria-selected="true" data-state="active">Thread</button>
          <button type="button" role="tab" aria-selected="false" data-state="inactive">Trades</button>
        </div>
      </div>
    </div>
    <div class="w-coin-right-col lg:flex-shrink-0">
      <div class="flex flex-col gap-3">
        <div class="hidden lg:block">
          <div class="relative">
            <section class="flex flex-col rounded-[12px] border" data-fixture="trade-panel">
              <div class="flex items-center gap-2">
                <div class="flex-1">
                  <div role="tablist" class="h-10 items-center justify-center text-gray-400">
                    <button type="button" role="tab" aria-selected="true" data-state="active" data-fixture="buy-tab">Buy</button>
                    <button type="button" role="tab" aria-selected="false" data-state="inactive" data-fixture="sell-tab">Sell</button>
                  </div>
                </div>
              </div>
              <div class="relative flex w-full min-w-0">
                <input type="text" aria-label="Amount in USD" />
                <div class="flex min-w-0 items-center justify-center"><button type="button" aria-label="Switch denomination (currently USD)">USD⇅</button></div>
              </div>
              <div class="flex items-center gap-2 px-1"><button type="button" data-state="closed" aria-label="Trade settings"></button></div>
              <button type="button" aria-pressed="false" class="button-module__button" data-fixture="primary">Connect wallet to trade</button>
              <div class="flex flex-col gap-1.5">
                <div role="group" aria-label="Quick buy" class="flex items-stretch gap-1.5">
                  <button type="button" aria-label="Quick buy $25">$25</button>
                  <button type="button" aria-label="Quick buy $100">$100</button>
                  <button type="button" aria-label="Quick buy $250">$250</button>
                </div>
                <div role="group" aria-label="Quick sell" class="flex items-stretch gap-1.5">
                  <button type="button" disabled aria-label="Quick sell 25%">25%</button>
                  <button type="button" disabled aria-label="Quick sell 50%">50%</button>
                  <button type="button" disabled aria-label="Quick sell 100%">100%</button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
