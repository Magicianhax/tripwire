# Tripwire hosted backend on Fly.io. One machine, SQLite on a volume.
# First-time setup and secrets: docs/DEPLOYMENT.md. Never put a secret in this file.

app = "tripwire-magician"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TRIPWIRE_HOSTED = "1"
  TRIPWIRE_HOSTED_HOST = "tripwire.magician.wtf"
  TRIPWIRE_DB = "/data/tripwire.db"
  # Same allowance a self-hoster gets; the global ceiling is the real brake on the bill.
  NANSEN_PER_INSTALL_DAILY_CREDITS = "3000"
  NANSEN_GLOBAL_DAILY_CREDITS = "20000"
  # Lets the wallet card's 100-credit Nansen label lookup run. It is never part of a card's own
  # load: one button, which states the price before it is pressed. At 3000 credits per install
  # per day that is at most 30 presses each, inside the 6000-per-network and 20000 global ceilings.
  NANSEN_ALLOW_PREMIUM = "1"

# SQLite needs one writer, so exactly one machine, always on: no cold start on the first card
# and no second machine forking the database.
[[mounts]]
  source = "tripwire_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
